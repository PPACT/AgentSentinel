[package]
name = "agentsentinel-console"
version = "0.1.0"
description = "AgentSentinel C1 desktop console (experiment)"
authors = ["AgentSentinel"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "agentsentinel_console_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
# 关闭默认 features（尤其 cookies）：plugin-http 启动时会写 app cache 的 .cookies，
# 在受限/沙箱环境报 os error 5 并阻止窗口启动；本地 daemon 只需明文 HTTP fetch。
tauri-plugin-http = { version = "2", default-features = false }
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"


# VS 2026 (MSVC 14.51) 在 debug profile 下给 C 代码传 `-Z7` 会触发 D8050
# （c1.dll: failed to get command line into debug records）；脚手架关闭 dev 调试信息。
[profile.dev]
debug = false

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
