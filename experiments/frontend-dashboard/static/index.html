<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AgentSentinel 中控（C1 试验）</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>AgentSentinel 中控</h1>
        <p class="subtitle">浏览器版 MVP · 事件驱动（SSE）· 无轮询</p>
      </div>
      <span id="connection" class="badge badge-connecting">连接中…</span>
    </header>

    <main>
      <section class="panel">
        <h2>Daemon</h2>
        <p id="daemon-summary" class="daemon-summary">中控未启动</p>
      </section>

      <div id="error-banner" class="error-banner" hidden></div>

      <section class="panel">
        <h2>Agents</h2>
        <table>
          <thead>
            <tr>
              <th>role</th>
              <th>pid</th>
              <th>pgid</th>
              <th>status</th>
              <th>alive</th>
              <th>last_heartbeat</th>
              <th>current_task_id</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="agents-body">
            <tr>
              <td colspan="8" class="empty">暂无 agent</td>
            </tr>
          </tbody>
        </table>
      </section>

      <section class="panel">
        <h2>Tasks</h2>
        <table>
          <thead>
            <tr>
              <th>task_id</th>
              <th>from_role</th>
              <th>to_role</th>
              <th>intent</th>
              <th>status</th>
              <th>updated_at</th>
            </tr>
          </thead>
          <tbody id="tasks-body">
            <tr>
              <td colspan="6" class="empty">暂无任务</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>

    <script type="module" src="./src/app.mjs"></script>
  </body>
</html>
